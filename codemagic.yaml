workflows:
  build-unsigned-ipa:
    name: Build Unsigned IPA (Aurust)
    instance_type: mac_mini_m2
    max_build_duration: 45
    inputs:
      ipa_url:
        description: "Link Spotify IPA gốc đã decrypt (để nguyên mặc định để build luôn)"
        type: string
        default: "https://files.catbox.moe/qa5eyg.ipa"
    environment:
      xcode: latest
      vars:
        THEOS: $CM_BUILD_DIR/theos
        INPUT_IPA_URL: "${{ inputs.ipa_url }}"
    scripts:
      - name: Verify Xcode 26+ & iPhoneOS SDK
        script: |
          set -euo pipefail
          xcodebuild -version
          SDK_LIST="$(ls -d "$(xcode-select -p)"/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS*.sdk 2>/dev/null || true)"
          if ! printf '%s\n' "$SDK_LIST" | grep -E 'iPhoneOS(2[6-9]|[3-9][0-9])\.' >/dev/null; then
            CANDIDATE="$(ls -d /Applications/Xcode-26*.app /Applications/Xcode-27*.app /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -n "$CANDIDATE" ]; then
              sudo xcode-select -s "$CANDIDATE/Contents/Developer"
            fi
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Clone Theos
        script: |
          set -euo pipefail
          rm -rf "$THEOS"
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/theos/theos.git "$THEOS"

      - name: Install Build Tools (gmake, dpkg, ldid, cyan)
        script: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages --upgrade pillow "git+https://github.com/asdfzxcvbn/pyzule-rw.git"

          PY_SCRIPTS="$(python3 -c 'import sysconfig; print(sysconfig.get_path("scripts"))')"
          PY_USER_BIN="$(python3 -m site --user-base)/bin"
          BREW_PREFIX="$(brew --prefix)"
          NEW_PATH="$PY_SCRIPTS:$PY_USER_BIN:$BREW_PREFIX/bin:$BREW_PREFIX/sbin:$PATH"
          echo "PATH=$NEW_PATH" >> "$CM_ENV"
          export PATH="$NEW_PATH"

          for cmd in gmake ldid dpkg-deb cyan; do
            command -v "$cmd" >/dev/null || { echo "Missing required tool: $cmd" >&2; exit 1; }
          done

      - name: Run Layer & Extension Checks
        script: |
          set -euo pipefail
          bash scripts/check-layers.sh
          make test-safari

      - name: Download & Validate Decrypted Spotify IPA
        script: |
          set -euo pipefail
          TARGET_URL="${IPA_URL:-$INPUT_IPA_URL}"
          if [ -z "$TARGET_URL" ]; then
            echo "Error: Chưa có link IPA. Để nguyên link mặc định hoặc dán direct link Spotify IPA đã decrypt." >&2
            exit 1
          fi
          mkdir -p ipa
          echo "==> Downloading decrypted Spotify IPA..."
          curl -fL --retry 3 --retry-delay 3 -o ipa/spotify.ipa "$TARGET_URL"

          MIME="$(file --mime-type -b ipa/spotify.ipa)"
          case "$MIME" in
            application/zip|application/x-ios-app|application/octet-stream) ;;
            *)
              echo "Error: File tải về không phải IPA hợp lệ (MIME: $MIME). Hãy dùng direct download link!" >&2
              exit 1
              ;;
          esac
          python3 - <<'PY'
          import plistlib, re, sys, zipfile
          with zipfile.ZipFile("ipa/spotify.ipa") as zf:
              plists = [n for n in zf.namelist() if re.match(r"^Payload/[^/]+\.app/Info\.plist$", n)]
              if not plists:
                  print("Error: File ZIP không chứa Payload/*.app/Info.plist hợp lệ.", file=sys.stderr)
                  print("Top entries:", zf.namelist()[:15], file=sys.stderr)
                  sys.exit(1)
              info = plistlib.loads(zf.read(plists[0]))
              name = info.get("CFBundleDisplayName") or info.get("CFBundleName") or "?"
              ver = info.get("CFBundleShortVersionString") or "?"
              bid = info.get("CFBundleIdentifier") or "?"
              print(f"==> Verified IPA: {name} {ver} ({bid}) [{plists[0]}]")
          PY

      - name: Build & Inject Unsigned IPA
        script: |
          set -euo pipefail
          MOD_VER="$(tr -d '[:space:]' < version.txt 2>/dev/null || echo '0.0.0')"
          OUT_IPA="out/Aurust-${MOD_VER}-unsigned.ipa"

          bash scripts/pipeline.sh ipa/spotify.ipa -o "$OUT_IPA" --no-flex

          ls -lh "$OUT_IPA" tweak/packages/*.deb
          shasum -a 256 "$OUT_IPA"

    artifacts:
      - out/*.ipa
      - tweak/packages/*.deb

  build-tweak-deb:
    name: Build Tweak Only (.deb)
    instance_type: mac_mini_m2
    max_build_duration: 30
    inputs:
      ipa_url:
        description: "Link Spotify IPA gốc đã decrypt (để nguyên mặc định để build luôn)"
        type: string
        default: "https://files.catbox.moe/qa5eyg.ipa"
    environment:
      xcode: latest
      vars:
        THEOS: $CM_BUILD_DIR/theos
        INPUT_IPA_URL: "${{ inputs.ipa_url }}"
    scripts:
      - name: Clone Theos & Install Tools
        script: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          rm -rf "$THEOS"
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/theos/theos.git "$THEOS"
          brew install make dpkg ldid
          echo "PATH=$(brew --prefix)/bin:$(brew --prefix)/sbin:$PATH" >> "$CM_ENV"

      - name: Extract Flag Table & Build .deb
        script: |
          set -euo pipefail
          TARGET_URL="${IPA_URL:-$INPUT_IPA_URL}"
          curl -fL --retry 3 --retry-delay 3 -o decrypted.ipa "$TARGET_URL"
          python3 scripts/extract-flags.py decrypted.ipa
          grep -q '^const SGFlagDef SGFlagTable\[\] = {' tweak/Sources/Shared/Flags/SGFlagTable.m 2>/dev/null \
            || grep -q '^const SGFlagDef SGFlagTable\[\] = {' tweak/Sources/Shared/Flags/SGFlagList.m
          env -u MAKELEVEL gmake -C tweak clean package
          rm -f decrypted.ipa
          ls -lh tweak/packages/*.deb

    artifacts:
      - tweak/packages/*.deb
